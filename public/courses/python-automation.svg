<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Python Automation and Scripting course preview">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','Courier New',monospace; }
      .prompt { fill: #d99a2b; font-size: 40px; font-weight: 700; }
      .code { fill: #7d6a5e; font-size: 40px; }
      .kw { fill: #b8502a; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f2e8de"/>
  <circle cx="1520" cy="90" r="210" fill="#e8d8c6"/>
  <circle cx="70" cy="150" r="150" fill="#e8d8c6"/>

  <text class="mono prompt" x="90" y="150">In [1]:</text>
  <text class="mono code" x="290" y="150"><tspan class="kw">for</tspan> file <tspan class="kw">in</tspan> folder.iterdir():</text>
  <text class="mono prompt" x="90" y="255">In [2]:</text>
  <text class="mono code" x="290" y="255">sheet[<tspan class="kw">"A1"</tspan>] = today</text>
  <text class="mono prompt" x="90" y="360">In [3]:</text>
  <text class="mono code" x="290" y="360"><tspan class="kw">send</tspan>(report, to=team)</text>

  <g transform="translate(120,470)">
